services:
  mysql:
    image: mysql:8.0
    container_name: dfs_mysql
    environment:
      MYSQL_DATABASE: digital_filipino_storybook
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  laravel:
    build:
      context: ./backend/laravel-api
      dockerfile: Dockerfile
    container_name: dfs_laravel_api
    working_dir: /var/www/html
    volumes:
      - ./backend/laravel-api:/var/www/html
    ports:
      - '8000:8000'
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: digital_filipino_storybook
      DB_USERNAME: app
      DB_PASSWORD: app
    command: >
      sh -c "php artisan key:generate --force &&
      php artisan migrate --force &&
      php artisan db:seed --force &&
      php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  mysql_data:
